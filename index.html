<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ground Control — Field CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root{
  --ink:#070B16; --panel:#0E1424; --panel2:#141B2E; --panel3:#1A2238;
  --line:#232C45; --line2:#2E3A5C;
  --indigo:#6366F1; --indigo-soft:#818CF8;
  --mint:#34D399; --amber:#FBBF24; --rose:#F87171;
  --text:#E7EBF7; --muted:#868FAB; --muted2:#5C6486;
  --radius:14px;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--text);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.45;
  padding-bottom:96px;
  overflow-x:hidden;
}
h1,h2,h3,.display{font-family:'Open Sans',Inter,sans-serif;font-weight:700;letter-spacing:-.01em;margin:0}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--indigo-soft)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}

/* ---------- shell ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,rgba(7,11,22,.97),rgba(7,11,22,.88));
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brandbar{display:flex;align-items:center;gap:12px;padding:16px 0 14px}
.mark{
  width:32px;height:32px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--indigo),#4F46E5);
  display:grid;place-items:center;font-family:'Open Sans';font-weight:800;font-size:15px;color:#fff;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 8px 24px -8px var(--indigo);
}
.brandbar h1{font-size:17px}
.brandbar .sub{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.savechip{margin-left:auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}

/* ---------- signature: money rail ---------- */
.cashhero{padding:8px 0 14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cashhero .chn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:30px;line-height:1;color:var(--mint)}
.cashhero .chl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.cashhero .cht{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.cashhero .cht.up{color:var(--mint)}
.rail{padding:4px 0 20px}
.railbar{
  display:flex;height:38px;border-radius:10px;overflow:hidden;
  border:1px solid var(--line);background:var(--panel);
}
.railseg{
  display:flex;align-items:center;padding:0 10px;min-width:0;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;
  transition:flex-grow .6s var(--ease);white-space:nowrap;overflow:hidden;
}
.railseg span{opacity:.62;font-weight:400;font-size:10px;margin-left:6px;
  letter-spacing:.1em;text-transform:uppercase}
.seg-won{background:linear-gradient(90deg,rgba(52,211,153,.28),rgba(52,211,153,.12));color:#8AF0C6;border-right:1px solid var(--line)}
.seg-quo{background:linear-gradient(90deg,rgba(251,191,36,.22),rgba(251,191,36,.08));color:#FCD46A;border-right:1px solid var(--line)}
.seg-pipe{background:linear-gradient(90deg,rgba(99,102,241,.22),rgba(99,102,241,.06));color:#A6AAF8}
.railseg.empty{color:var(--muted);background:transparent}

/* ---------- today strip ---------- */
.today{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding-bottom:20px}
.kpi{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:9px 10px 9px 13px;position:relative;overflow:hidden;
  border-left:3px solid var(--indigo);
}
.kpi .n{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;line-height:1.1}
.kpi .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.kpi .t{font-size:10px;color:var(--muted);opacity:.7}
.kpi .meter{position:absolute;left:0;bottom:0;height:2px;background:var(--indigo);transition:width .5s var(--ease)}
.kpi.hit{border-left-color:var(--mint)}
.kpi.hit .meter{background:var(--mint)}
.kpi.hit .n{color:var(--mint)}

/* ---------- snapshot dashboard ---------- */
.snapgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.snapcard{padding:12px 13px 10px;display:flex;flex-direction:column;min-width:0}
.snapcard .sh{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.snapcard .sh .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;flex:none}
.snapcard .sh h4{margin:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.snapcard canvas{max-width:100%}
.funnelrow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px}
.funnelrow .fl{width:56px;flex:none;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px}
.funnelrow .fb{flex:1;height:7px;border-radius:99px;background:var(--ink);overflow:hidden}
.funnelrow .fb i{display:block;height:100%;border-radius:99px;transition:width .5s var(--ease)}
.funnelrow .fn{width:20px;flex:none;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text);font-size:10.5px}
.legendrow{display:flex;align-items:center;gap:7px;font-size:11px;padding:3px 0;color:var(--muted)}
.legendrow .dot{width:8px;height:8px;border-radius:50%;flex:none}
.legendrow .ln{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legendrow .lv{font-family:'JetBrains Mono',monospace;color:var(--text);font-size:10.5px}
.donutwrap{display:flex;align-items:center;gap:12px;flex:1;min-height:0}
.donutwrap .dcanvas{width:78px;height:78px;flex:none;position:relative}
.donutwrap .legend{flex:1;min-width:0}
@media (max-width:960px){.snapgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.snapgrid{grid-template-columns:1fr}}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:4px;border-top:1px solid var(--line);padding:8px 0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);
  border:1px solid transparent;white-space:nowrap;transition:all .2s var(--ease)
}
.tab:hover{color:var(--text)}
.tab.on{background:var(--panel3);color:var(--text);border-color:var(--line2)}
.tab .badge{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.6;margin-left:5px}

/* ---------- generic ---------- */
main{padding-top:28px}
.sectionhead{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.sectionhead h2{font-size:15px}
.sectionhead .hint{font-size:12px;color:var(--muted)}
.sectionhead .right{margin-left:auto;display:flex;gap:8px}
.btn{
  padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;
  background:var(--panel2);border:1px solid var(--line2);color:var(--text);
  transition:all .18s var(--ease)
}
.btn:hover{background:var(--panel3);border-color:#3B4874}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.primary:hover{background:#4F46E5}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{color:var(--rose);border-color:#4A2436}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.chip:focus-visible
  {outline:2px solid var(--indigo-soft);outline-offset:2px}

.field{display:block;margin-bottom:10px}
.field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border-radius:10px;background:var(--ink);
  border:1px solid var(--line);color:var(--text);
}
.field textarea{min-height:78px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{
  border:1px dashed var(--line2);border-radius:var(--radius);padding:34px 20px;text-align:center;
  color:var(--muted);font-size:13.5px;background:var(--panel)
}
.empty b{display:block;color:var(--text);font-family:'Open Sans';font-size:15px;margin-bottom:6px}

/* ---------- filters ---------- */
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:180px;padding:9px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-bottom:12px}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  padding:6px 11px;border-radius:999px;font-size:12px;white-space:nowrap;
  background:var(--panel);border:1px solid var(--line);color:var(--muted)
}
.chip.on{background:rgba(99,102,241,.16);border-color:var(--indigo);color:var(--indigo-soft)}
.chip .c{font-family:'JetBrains Mono',monospace;opacity:.6;margin-left:4px;font-size:10px}

/* ---------- lead cards ---------- */
.leadlist{display:grid;gap:9px}
.lead{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 14px;display:flex;gap:12px;align-items:flex-start;
  transition:border-color .2s var(--ease),transform .2s var(--ease);cursor:pointer;
  border-left:3px solid var(--line2);
}
.lead:hover{border-color:var(--line2);transform:translateX(2px)}
.lead.s-outreached{border-left-color:#4C5B8A}
.lead.s-warm{border-left-color:var(--amber)}
.lead.s-mockup{border-left-color:#38BDF8}
.lead.s-quoted{border-left-color:var(--indigo)}
.lead.s-won{border-left-color:var(--mint)}
.lead.s-upsold{border-left-color:#C084FC}
.lead.s-lost{border-left-color:#3A4157;opacity:.55}
.lead .body{flex:1;min-width:0}
.lead .biz{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lead .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.lead .note{font-size:12px;color:var(--muted);margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pill{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;padding:2.5px 7px;border-radius:5px;
  background:var(--panel3);color:var(--muted);font-weight:600}
.pill.outreached{background:rgba(76,91,138,.28);color:#A9B4DA}
.pill.warm{background:rgba(251,191,36,.15);color:var(--amber)}
.pill.mockup{background:rgba(56,189,248,.16);color:#7DD3FC}
.pill.quoted{background:rgba(99,102,241,.16);color:var(--indigo-soft)}
.pill.won{background:rgba(52,211,153,.15);color:var(--mint)}
.pill.upsold{background:rgba(192,132,252,.18);color:#D8B4FE}
.pill.due{background:rgba(248,113,113,.15);color:var(--rose)}
.lead .val{text-align:right;flex:none}
.lead .val .amt{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px}
.lead .val .amt.zero{color:var(--muted);font-weight:400}
.lead .val .up{font-size:10px;color:var(--muted);margin-top:3px;font-family:'JetBrains Mono',monospace}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,7,14,.72);backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;z-index:61;right:0;top:0;bottom:0;width:min(560px,100%);
  background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .38s var(--ease);
  display:flex;flex-direction:column;
}
.drawer.on{transform:none}
.drawer .dhead{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .dhead h3{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .dbody{flex:1;overflow-y:auto;padding:16px;overscroll-behavior:contain}
.drawer .dfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--panel)}
.x{width:32px;height:32px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;color:var(--muted);flex:none}

.block{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px;background:var(--panel2)}
.block h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin:0 0 10px;font-weight:600;font-family:Inter}
.stagepick{display:flex;gap:5px;flex-wrap:wrap}
.stagepick .chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff}

.checkrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.checkrow:last-child{border-bottom:0}
.checkrow .cb{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;font-size:11px;color:transparent;transition:all .15s var(--ease)}
.checkrow.on .cb{background:var(--mint);border-color:var(--mint);color:#062b1c}
.checkrow .nm{flex:1;font-size:13.5px}
.checkrow.on .nm{color:var(--muted);text-decoration:line-through}
.checkrow .pr{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted)}

.saleitem{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.saleitem input:first-child{flex:1}
.saleitem input{padding:8px 10px;border-radius:8px;background:var(--ink);border:1px solid var(--line);color:var(--text);font-size:13px}
.saleitem .amtin{width:88px;font-family:'JetBrains Mono',monospace}
.saleitem .recv{color:var(--mint);border-color:#1F4A3A}
.salehead{display:flex;gap:8px;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);margin-bottom:6px;padding:0 2px}
.salehead span:first-child{flex:1}
.salehead span{width:88px;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:6px;border-top:1px solid var(--line2)}
.total .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
.total .num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;color:var(--mint)}

.logitem{font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.logitem:last-child{border:0}
.logitem b{color:var(--text);font-weight:500}
.logitem .ts{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.6;display:block}

/* ---------- templates ---------- */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:border-color .2s var(--ease)}
.tcard:hover{border-color:var(--line2)}
.tcard .thumb{aspect-ratio:16/10;background:var(--panel3);display:grid;place-items:center;color:var(--muted);font-size:11px;overflow:hidden;position:relative}
.tcard .thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.tcard .tb{padding:11px 12px}
.tcard .tn{font-weight:600;font-size:13.5px}
.tcard .tc{font-size:11px;color:var(--muted);margin-top:2px}
.tcard .ta{display:flex;gap:6px;margin-top:10px}

/* ---------- quote ---------- */
.qline{display:grid;grid-template-columns:1fr 62px 110px 34px;gap:7px;margin-bottom:7px;align-items:center}
.qline input{padding:8px 10px;border-radius:8px;background:var(--ink);border:1px solid var(--line);color:var(--text);font-size:13px;width:100%}
.qline .n{font-family:'JetBrains Mono',monospace;text-align:right}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.qdoc{background:#fff;color:#111827;border-radius:12px;padding:26px;font-size:13px}
.qdoc h3{font-family:'Open Sans';font-size:19px;color:#0B1020}
.qdoc table{width:100%;border-collapse:collapse;margin:16px 0}
.qdoc th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#6B7280;border-bottom:1px solid #E5E7EB;padding:7px 0;font-weight:600}
.qdoc td{padding:9px 0;border-bottom:1px solid #F3F4F6}
.qdoc .r{text-align:right;font-family:'JetBrains Mono',monospace}
.qdoc .grand{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#0B1020}
.qdoc .fine{font-size:11px;color:#6B7280;line-height:1.6;margin-top:16px;border-top:1px solid #E5E7EB;padding-top:12px}

/* ---------- auth gate ---------- */
.authgate{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:radial-gradient(80% 60% at 50% 0%,rgba(99,102,241,.14),transparent),var(--ink);
  padding:20px;
}
.gatecard{
  width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:28px 24px;text-align:center;box-shadow:0 24px 60px -20px rgba(0,0,0,.6);
}
.gatecard h2{font-size:19px;margin-bottom:6px}
.gatecard .hint{font-size:12.5px;color:var(--muted);margin:0 0 18px;line-height:1.5}
.gatecard .field{text-align:left}
.gatecard .btn{margin-top:6px}
.gateerr{
  background:rgba(248,113,113,.12);border:1px solid #4A2436;color:var(--rose);
  border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:12px;text-align:left;
}

/* ---------- fab ---------- */
.fab{
  position:fixed;right:18px;bottom:22px;z-index:50;
  padding:14px 20px;border-radius:999px;background:var(--indigo);color:#fff;font-weight:600;font-size:14px;
  box-shadow:0 12px 32px -8px rgba(99,102,241,.7),0 0 0 1px rgba(255,255,255,.09);
  transition:transform .2s var(--ease)
}
.fab:hover{transform:translateY(-2px)}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);z-index:90;
  background:var(--panel3);border:1px solid var(--line2);border-radius:10px;padding:10px 16px;font-size:13px;
  transition:transform .3s var(--ease);box-shadow:0 16px 40px -12px #000
}
.toast.on{transform:translate(-50%,0)}

@media (max-width:720px){
  .today{grid-template-columns:repeat(3,1fr)}
  .today .kpi:nth-child(n+4){grid-column:span 1}
  .grid2{grid-template-columns:1fr}
  .qline{grid-template-columns:1fr 50px 92px 30px}
  .drawer{width:100%}
  body{padding-bottom:110px}
  nav.tabs{flex-wrap:wrap;overflow-x:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body>*:not(#printroot){display:none!important}
  #printroot{display:block!important;padding:0}
  .qdoc{border-radius:0;padding:0}
  body{background:#fff;padding:0}
}
#printroot{display:none}
</style>
</head>
<body>

<div id="authGate" class="authgate"></div>

<div id="appRoot" style="display:none">
<header class="top">
  <div class="wrap">
    <div class="brandbar">
      <div class="mark">G</div>
      <div>
        <h1>Ground Control</h1>
        <div class="sub">Field CRM</div>
      </div>
      <div class="savechip"><span class="dot"></span><span id="saveState">Saved</span></div>
    </div>

    <div class="cashhero" id="cashHero"></div>

    <div class="rail">
      <div class="railbar" id="rail"></div>
    </div>

    <div class="today" id="today"></div>

    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap" id="view"></main>

<button class="fab" id="fab">+ Add lead</button>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dhead">

   A short mirror of each event also lands in the lead's own
   `log` jsonb array (via log()) so its drawer shows history
   instantly without a join. Text-field edits are diffed against
   a per-drawer-session baseline and coalesced on the same debounce
   as autosave, so typing doesn't spam one row per keystroke.
   ============================================================ */
let sawCloudError=false;
async function logActivity(action,opts){
  opts=opts||{};
  try{
    if(!cloudClient && !initCloud()) return;
    await cloudClient.from('activity_log').insert({
      lead_id:opts.leadId||null, biz:opts.biz||null, action,
      field:opts.field||null,
      old_value:opts.oldValue!=null?String(opts.oldValue).slice(0,1000):null,
      new_value:opts.newValue!=null?String(opts.newValue).slice(0,1000):null,
      message:opts.message||null
    });
  }catch(e){ console.error('activity log write failed',e); }
}
function logCloudError(context,e){
  const msg=context+' — '+((e&&e.message)||String(e));
  if(sawCloudError) return; // avoid spamming one row per retry while offline
  sawCloudError=true;
  logActivity('error',{message:msg});
}

  area:'Area',maps:'Maps link',batch:'Batch',source:'Source',stage:'Stage',next:'Follow-up date',
  notes:'Notes',upsells:'Upsells',sales:'Sales'};
function diffAndLogLead(before,after){
  if(!before){ logActivity('create',{leadId:after.id,biz:after.biz,message:'Lead added'}); return; }
  Object.keys(FIELD_LABELS).forEach(f=>{
    if(f==='stage') return; // stage changes are logged immediately at the click handler, not diffed here
    const bv=Array.isArray(before[f])?JSON.stringify(before[f]):(before[f]||'');
    const av=Array.isArray(after[f])?JSON.stringify(after[f]):(after[f]||'');
    if(bv===av) return;
    logActivity('update',{leadId:after.id,biz:after.biz,field:f,oldValue:bv,newValue:av,message:`${FIELD_LABELS[f]} changed`});
    log(after,`${FIELD_LABELS[f]} updated`);
  });
}

async function sha256Hex(str){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomSalt(){
  const arr=new Uint8Array(16); crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPassword(pass,salt){ return sha256Hex(salt+'::'+pass); }

async function handleLogin(){
  const user=($('#gateUser').value||'').trim();
  const pass=$('#gatePass').value||'';
  if(!user||!pass){ renderGate('login',{err:'Enter username and password'}); return; }
  const btn=$('#gateSubmit'); if(btn){ btn.disabled=true; btn.textContent='Checking…'; }
  let row=null;
  try{
    if(!cloudClient) initCloud();
    if(cloudClient){
      const {data,error}=await cloudClient.from('app_admin').select('*').eq('id',1).maybeSingle();
      if(error) throw error;
      row=data;
    }
  }catch(e){ console.error('admin fetch failed',e); logCloudError('Admin login fetch failed',e); }
  if(!row){
    const cached=getAdminCache();
    if(cached) row={username:cached.username,password_hash:cached.hash,password_salt:cached.salt};
  }
  if(!row){ renderGate('login',{err:'Cannot reach the server to verify login — check your connection and try again',user}); return; }
  const hash=await hashPassword(pass,row.password_salt);
  if(user!==row.username || hash!==row.password_hash){ renderGate('login',{err:'Incorrect username or password',user}); return; }
  setAdminCache({username:row.username,hash:row.password_hash,salt:row.password_salt});
  adminUsername=row.username;
  setSession(true);
  enterApp();
}

async function handleSetup(){
  const user=($('#gateUser').value||'admin').trim()||'admin';

  if(!cloudClient && !initCloud()){ renderGate('setup',{err:'Cannot reach the server — check your connection and reload'}); return; }
  const salt=randomSalt();
  const hash=await hashPassword(pass,salt);
  try{
    const {error}=await cloudClient.from('app_admin').insert({id:1,username:user,password_hash:hash,password_salt:salt});
    if(error) throw error;
  }catch(e){ console.error('admin setup failed',e); logCloudError('Admin setup failed',e); renderGate('setup',{err:'Could not save — check your connection and try again'}); return; }
  setAdminCache({username:user,hash,salt});
  adminUsername=user;
  setSession(true);
  logActivity('create',{field:'app_admin',message:'Admin login created'});
  enterApp();
}

function renderRail(){
  const won=S.leads.filter(l=>['won','upsold'].includes(l.stage)).reduce((a,l)=>a+leadValue(l),0);
  const quo=S.leads.filter(l=>l.stage==='quoted').reduce((a,l)=>a+(leadValue(l)||pipeValue(l)),0);
  const pipe=S.leads.filter(l=>['pipeline','outreached','warm','mockup'].includes(l.stage)).reduce((a,l)=>a+pipeValue(l),0);
  const tot=won+quo+pipe;
  const el=$('#rail');
  if(!tot){ el.innerHTML='<div class="railseg empty" style="flex:1;justify-content:center">No money on the board yet — add your first lead</div>'; return; }
  const seg=(cls,val,lab)=>{
    const pct=Math.max(val/tot*100,val?11:0);
    return val?`<div class="railseg ${cls}" style="flex:${pct} 1 0">${shortInr(val)}<span>${lab}</span></div>`:'';
  };
  el.innerHTML=seg('seg-won',won,'closed value')+seg('seg-quo',quo,'quoted')+seg('seg-pipe',pipe,'pipeline');
}

function todayCounts(){
  const d=today(); const c={doors:0,convos:0,mockups:0,quotes:0,closes:0};
  S.leads.forEach(l=>{
    if((l.createdAt||'').slice(0,10)===d) c.doors++;
    (l.log||[]).forEach(g=>{
      if(g.ts.slice(0,10)!==d) return;
      if(/→ Outreached|→ Warm/.test(g.text)) c.convos++;
      if(/Mockup/i.test(g.text)) c.mockups++;
      if(/Quote/i.test(g.text)) c.quotes++;
      if(/→ Closed/.test(g.text)) c.closes++;
    });
  });
  return c;
}
function renderToday(){
  const c=todayCounts(), t=S.targets;
  const rows=[
    ['doors','Doors',c.doors,t.doors],
    ['convos','Owner talks',c.convos,t.convos],

    ['quotes','Quotes',c.quotes,t.quotes],

}

   daily_manual_stats + leads. No hand-kept counters duplicated.

let chartInstances={};
function dayKey(iso){ return (iso||'').slice(0,10); }
function lastNDays(n){
  const days=[];
  for(let i=n-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
  return days;
}
async function fetchMetricsData(){
  if(!cloudClient && !initCloud()) return {activity:[],manual:[]};
  try{
    const since=new Date(Date.now()-45*864e5).toISOString();
    const [act,man]=await Promise.all([
      cloudClient.from('activity_log').select('*').gte('created_at',since),
      cloudClient.from('daily_manual_stats').select('*')
    ]);
    return {activity:(act&&act.data)||[], manual:(man&&man.data)||[]};
  }catch(e){ console.error('metrics fetch failed',e); logCloudError('Metrics fetch failed',e); return {activity:[],manual:[]}; }
}

async function renderMetricsCharts(weekKey){
  const {activity,manual}=await fetchMetricsData();
  if(tab!=='metrics') return; // user navigated away while this was loading
  if(typeof Chart==='undefined'){
    ['chartTrend','chartFunnel','chartRevenue'].forEach(id=>{
      const el=$('#'+id); if(el&&el.parentElement) el.parentElement.innerHTML='<div class="empty" style="padding:16px"><b>Charts unavailable</b>Chart.js failed to load — check your connection and reload.</div>';
    });
  }
  const manualByDate={}; manual.forEach(m=>{ manualByDate[m.date]=m; });
  const today0=today();
  const todayManual=manualByDate[today0];
  const dEl=$('#mDoors'), cEl=$('#mConvos');
  if(dEl&&todayManual) dEl.value=todayManual.doors||0;
  if(cEl&&todayManual) cEl.value=todayManual.convos||0;

  const days=lastNDays(metricsRange);
  const stageEvents=activity.filter(a=>a.action==='update'&&a.field==='stage');
  const countOn=(day,stageId)=>stageEvents.filter(a=>dayKey(a.created_at)===day&&a.new_value===stageId).length;
  const doorsSeries=days.map(d=>(manualByDate[d]&&manualByDate[d].doors)||0);
  const convosSeries=days.map(d=>(manualByDate[d]&&manualByDate[d].convos)||0);
  const mockupSeries=days.map(d=>countOn(d,'mockup'));
  const quoteSeries=days.map(d=>countOn(d,'quoted'));
  const closeSeries=days.map(d=>countOn(d,'won')+countOn(d,'upsold'));

  const trendCtx=$('#chartTrend');
  if(trendCtx){
    if(chartInstances.trend) chartInstances.trend.destroy();
    chartInstances.trend=new Chart(trendCtx,{type:'line',data:{labels:days.map(d=>d.slice(5)),datasets:[
      {label:'Doors',data:doorsSeries,borderColor:'#6366F1',backgroundColor:'transparent',tension:.3},
      {label:'Owner talks',data:convosSeries,borderColor:'#818CF8',backgroundColor:'transparent',tension:.3},
      {label:'Mockups',data:mockupSeries,borderColor:'#38BDF8',backgroundColor:'transparent',tension:.3},
      {label:'Quotes',data:quoteSeries,borderColor:'#FBBF24',backgroundColor:'transparent',tension:.3},
      {label:'Closes',data:closeSeries,borderColor:'#34D399',backgroundColor:'transparent',tension:.3}
    ]},options:{responsive:true,plugins:{legend:{labels:{color:'#868FAB'}}},
      scales:{x:{ticks:{color:'#868FAB'},grid:{color:'#232C45'}},y:{ticks:{color:'#868FAB'},grid:{color:'#232C45'},beginAtZero:true}}}});
  }

  const funnelCtx=$('#chartFunnel');
  if(funnelCtx){
    if(chartInstances.funnel) chartInstances.funnel.destroy();
    const live=S.leads.filter(l=>!l.deletedAt);
    const counts=STAGES.map(s=>live.filter(l=>l.stage===s.id).length);
    chartInstances.funnel=new Chart(funnelCtx,{type:'bar',data:{labels:STAGES.map(s=>s.label),datasets:[
      {label:'Leads',data:counts,backgroundColor:'#6366F1'}
    ]},options:{responsive:true,plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:'#868FAB'},grid:{display:false}},y:{ticks:{color:'#868FAB'},grid:{color:'#232C45'},beginAtZero:true}}}});
  }

  const revCtx=$('#chartRevenue');
  if(revCtx){
    if(chartInstances.revenue) chartInstances.revenue.destroy();
    const closeEvents=activity.filter(a=>a.action==='update'&&a.field==='stage'&&(a.new_value==='won'||a.new_value==='upsold'))
      .sort((a,b)=>a.created_at<b.created_at?-1:1);
    const byId={}; S.leads.forEach(l=>byId[l.id]=l);
    let running=0; const revDays=[], revVals=[];
    closeEvents.forEach(ev=>{
      const lead=byId[ev.lead_id]; if(!lead) return;
      running+=leadValue(lead);
      revDays.push(dayKey(ev.created_at)); revVals.push(running);
    });
    chartInstances.revenue=new Chart(revCtx,{type:'line',data:{labels:revDays,datasets:[
      {label:'Cumulative deal value',data:revVals,borderColor:'#34D399',backgroundColor:'rgba(52,211,153,.12)',fill:true,tension:.3}
    ]},options:{responsive:true,plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:'#868FAB'},grid:{color:'#232C45'}},y:{ticks:{color:'#868FAB',callback:v=>shortInr(v)},grid:{color:'#232C45'}}}}});
  }

  const readout=$('#weekReadout');
  if(readout){
    const weekCloses=activity.filter(a=>a.action==='update'&&a.field==='stage'&&(a.new_value==='won'||a.new_value==='upsold')&&a.created_at>=weekKey).length;
    const weekRev=S.leads.filter(l=>['won','upsold'].includes(l.stage)&&(l.updatedAt||'')>=weekKey).reduce((a,l)=>a+leadValue(l),0);
    const floorCloses=2, floorRev=50000;
    readout.innerHTML=`
      <div class="grid2">
        <div><div class="total" style="border:0;padding:0;margin:0"><span class="lab">Closes this week</span><span class="num" style="color:${weekCloses>=floorCloses?'var(--mint)':'var(--text)'}">${weekCloses} / ${floorCloses}</span></div></div>
        <div><div class="total" style="border:0;padding:0;margin:0"><span class="lab">Revenue this week</span><span class="num" style="color:${weekRev>=floorRev?'var(--mint)':'var(--text)'}">${inr(weekRev)} / ${inr(floorRev)}</span></div></div>
      </div>`;
  }
}

/* ============================================================
   SNAPSHOT — compact always-on analytics panel on the Pipeline
   home screen. Stage/category/won-lost figures come straight from
   S.leads (instant, no network). The 7-day trend reuses the same
   activity_log query as the Metrics tab, cached for a minute so
   re-rendering the board (e.g. while typing a search) doesn't
   re-fetch on every keystroke.
   ============================================================ */
let snapChartInstances={};
const SNAP_PALETTE=['#6366F1','#34D399','#FBBF24','#F87171','#38BDF8','#C084FC','#818CF8','#A9B4DA','#7DD3FC','#D8B4FE'];
let snapTrendCache=null, snapTrendCacheAt=0, snapTrendFetching=null;
async function getSnapTrendData(){
  const now=Date.now();
  if(snapTrendCache && (now-snapTrendCacheAt)<60000) return snapTrendCache;
  if(snapTrendFetching) return snapTrendFetching;
  snapTrendFetching=fetchMetricsData().then(data=>{ snapTrendCache=data; snapTrendCacheAt=Date.now(); snapTrendFetching=null; return data; });
  return snapTrendFetching;
}
function renderSnapshotFunnel(){
  const el=$('#snapFunnel'); if(!el) return;
  const live=S.leads.filter(l=>!l.deletedAt);
  const counts=STAGES.map(s=>live.filter(l=>l.stage===s.id).length);
  const max=Math.max(1,...counts);
  const colors={pipeline:'#6366F1',outreached:'#4C5B8A',warm:'#FBBF24',mockup:'#38BDF8',quoted:'#818CF8',won:'#34D399',upsold:'#C084FC',lost:'#3A4157'};
  const shortLabels={outreached:'Outreach',mockup:'Mockup'};
  el.innerHTML=STAGES.map((s,i)=>`
    <div class="funnelrow">
      <span class="fl">${shortLabels[s.id]||s.label}</span>
      <span class="fb"><i style="width:${counts[i]/max*100}%;background:${colors[s.id]}"></i></span>
      <span class="fn">${counts[i]}</span>
    </div>`).join('');
}
function renderDonut(canvasId,legendId,labels,values,colors){
  const canvas=$('#'+canvasId), legendEl=$('#'+legendId);
  if(!canvas||!legendEl) return;
  if(legendEl) legendEl.innerHTML=labels.map((l,i)=>`
    <div class="legendrow"><span class="dot" style="background:${colors[i]}"></span><span class="ln">${esc(l)}</span><span class="lv">${values[i]}</span></div>`).join('');
  if(typeof Chart==='undefined'){ canvas.parentElement.innerHTML='<span style="font-size:10.5px;color:var(--muted)">Charts unavailable</span>'; return; }
  const key=canvasId;
  if(snapChartInstances[key]) snapChartInstances[key].destroy();
  snapChartInstances[key]=new Chart(canvas,{type:'doughnut',data:{labels,datasets:[{data:values,backgroundColor:colors,borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false},tooltip:{enabled:true}}}});
}
function renderSnapshotCategory(){
  const live=S.leads.filter(l=>!l.deletedAt);
  const counts={};
  live.forEach(l=>{ const c=l.cat||'Uncategorised'; counts[c]=(counts[c]||0)+1; });
  const labels=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,6);
  renderDonut('snapCategory','snapCategoryLegend',labels,labels.map(l=>counts[l]),labels.map((_,i)=>SNAP_PALETTE[i%SNAP_PALETTE.length]));
}
function renderSnapshotWinLoss(){
  const live=S.leads.filter(l=>!l.deletedAt);
  const won=live.filter(l=>['won','upsold'].includes(l.stage)).length;
  const lost=live.filter(l=>l.stage==='lost').length;
  const active=live.length-won-lost;
  renderDonut('snapWinLoss','snapWinLossLegend',['Won','Active','Lost'],[won,active,lost],['#34D399','#6366F1','#F87171']);
}
async function renderSnapshotTrend(){
  const el=$('#snapTrend'); if(!el) return;
  if(typeof Chart==='undefined'){ el.parentElement.innerHTML+='<span style="font-size:10.5px;color:var(--muted)">Charts unavailable</span>'; return; }
  const {activity,manual}=await getSnapTrendData();
  if(tab!=='board') return;
  const el2=$('#snapTrend'); if(!el2) return;
  const days=lastNDays(7);
  const manualByDate={}; manual.forEach(m=>{ manualByDate[m.date]=m; });
  const stageEvents=activity.filter(a=>a.action==='update'&&a.field==='stage');
  const closesOn=d=>stageEvents.filter(a=>dayKey(a.created_at)===d&&(a.new_value==='won'||a.new_value==='upsold')).length;
  const doorsSeries=days.map(d=>(manualByDate[d]&&manualByDate[d].doors)||0);
  const closeSeries=days.map(d=>closesOn(d));
  if(snapChartInstances.trend) snapChartInstances.trend.destroy();
  snapChartInstances.trend=new Chart(el2,{type:'line',data:{labels:days.map(d=>d.slice(5)),datasets:[
    {label:'Doors',data:doorsSeries,borderColor:'#6366F1',backgroundColor:'transparent',tension:.3,pointRadius:2},
    {label:'Closes',data:closeSeries,borderColor:'#34D399',backgroundColor:'transparent',tension:.3,pointRadius:2}
  ]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#868FAB',boxWidth:8,font:{size:9}}}},
    scales:{x:{ticks:{color:'#868FAB',font:{size:9}},grid:{display:false}},y:{ticks:{color:'#868FAB',font:{size:9}},grid:{color:'#232C45'},beginAtZero:true}}}});
}
// Debounced: viewBoard() re-renders wholesale on every search keystroke, and the
// snapshot doesn't depend on the search text at all — so coalesce rapid rebuilds
// instead of tearing down and recreating four charts per character typed.
let snapPanelTimer=null;
function renderSnapshotPanel(){
  clearTimeout(snapPanelTimer);
  snapPanelTimer=setTimeout(()=>{
    if(tab!=='board') return;
    if(!$('#snapFunnel')) return;
    renderSnapshotFunnel();
    renderSnapshotCategory();
    renderSnapshotWinLoss();
    renderSnapshotTrend();
  },120);
}

// Writes the drawer's working copy into S.leads and schedules a save —
// called on every meaningful edit (not just the Save button) so nothing
// typed into the drawer only lives in memory.
function syncOpenLead(){
  const l=openLead; if(!l) return false;
  if(!l.biz||!l.biz.trim()) return false;
  l.updatedAt=new Date().toISOString();
  const ix=S.leads.findIndex(x=>x.id===l.id);
  const clean={...l}; delete clean._new;
  if(ix<0){
    clean.log=clean.log||[];
    if(!clean.log.some(g=>g.text==='Lead added')) clean.log.unshift({ts:new Date().toISOString(),text:'Lead added'});
    S.leads.unshift(clean);
  } else {
    S.leads[ix]=clean;
  }
  scheduleActivityDiff(clean.id);
  l._new=false;
  persist();
  return true;
}

function commitLead(){
  const l=openLead; if(!l) return;
  if(!l.biz.trim()){toast('Business name is required');return;}
  const wasNew=l._new;
  syncOpenLead();
  closeDrawer(); render(); toast(wasNew?'Lead added':'Saved');
}

      if(openLead.stage==='pipeline'&&d.setstage!=='pipeline'&&!openLead.firstContactedAt) openLead.firstContactedAt=new Date().toISOString();
      openLead.stage=d.setstage;
      if((d.setstage==='warm'||d.setstage==='mockup')&&!openLead.next){const n=new Date();n.setDate(n.getDate()+1);openLead.next=n.toISOString().slice(0,10);}
    }
    syncOpenLead(); drawDrawer(); return;
  }
  if(d.up&&openLead){
    const i=openLead.upsells.indexOf(d.up);
    i<0?openLead.upsells.push(d.up):openLead.upsells.splice(i,1);
    syncOpenLead(); drawDrawer(); return;
  }
  if(d.snooze&&openLead){
    const n=new Date(); n.setDate(n.getDate()+Number(d.snooze));
    openLead.next=n.toISOString().slice(0,10); syncOpenLead(); drawDrawer(); return;
  }
  if(t.hasAttribute('data-mockup')&&openLead){
    log(openLead,'Mockup delivered');
    if(['pipeline','outreached','warm'].includes(openLead.stage)){ openLead.stage='mockup'; log(openLead,'Stage → Mockup Pending'); }
    if(!openLead.next){ const n=new Date(); n.setDate(n.getDate()+1); openLead.next=n.toISOString().slice(0,10); }
    syncOpenLead(); drawDrawer(); toast('Mockup logged'); return;
  }
  if(d.sdel!=null&&openLead){ openLead.sales.splice(Number(d.sdel),1); syncOpenLead(); drawDrawer(); return; }
  if(t.id==='addSale'&&openLead){ openLead.sales.push({item:'',amount:0,received:0,date:today()}); syncOpenLead(); drawDrawer(); return; }
  if(t.id==='saveLead'){ commitLead(); return; }
  if(t.id==='delLead'&&openLead){
    if(confirm('Archive this lead? It will be hidden from the board but stays recoverable in Archive view — nothing is permanently destroyed.')){
      openLead.deletedAt=new Date().toISOString();
      log(openLead,'Archived (soft delete)');
      logActivity('delete',{leadId:openLead.id,biz:openLead.biz,message:'Lead archived'});
      syncOpenLead(); closeDrawer(); render(); toast('Lead archived');
    }
    return;
  }
  if(t.id==='restoreLead'&&openLead){
    openLead.deletedAt=null;
    log(openLead,'Restored from archive');
    logActivity('update',{leadId:openLead.id,biz:openLead.biz,field:'deleted_at',message:'Lead restored from archive'});
    syncOpenLead(); closeDrawer(); render(); toast('Lead restored');
    return;
  }
  if(t.id==='drawerClose'||t.id==='scrim'){ closeDrawer(); return; }
  if(t.id==='fab'){ openDrawer(blankLead(),true); return; }

  /* templates */
  if(t.id==='addTpl'){
    const name=prompt('Template name (e.g. Salon — Zeta)'); if(!name) return;
    const url=prompt('Live URL (https://…)'); if(!url) return;
    const cat=prompt('Category',S.cats[0])||'';
    S.templates.push({id:uid(),name,url,cat,img:''});
    persist(); render();
    if(confirm('Add a preview image now?')) pickTemplateImage(S.templates[S.templates.length-1].id);
    return;
  }
  if(d.deltpl){ S.templates=S.templates.filter(x=>x.id!==d.deltpl); persist(); render(); return; }
  if(d.copy){ try{ await navigator.clipboard.writeText(d.copy); toast('Link copied'); }catch(_){ toast('Copy failed'); } return; }

  /* quote */
  if(d.preset&&draftQuote){
    const u=UPSELLS.find(x=>x.id===d.preset);
    draftQuote.items.push({desc:u.name,qty:1,rate:u.price}); render(); return;
  }
  if(t.id==='qAdd'&&draftQuote){ draftQuote.items.push({desc:'',qty:1,rate:0}); render(); return; }
  if(d.qdel!=null&&draftQuote){ draftQuote.items.splice(Number(d.qdel),1); render(); return; }
  if(t.id==='qPrint'){
    $('#printroot').innerHTML=quoteHTML(draftQuote); window.print(); return;
  }
  if(t.id==='qSave'&&draftQuote){
    if(!draftQuote.leadId){toast('Pick a lead first');return;}
    const lead=S.leads.find(l=>l.id===draftQuote.leadId);
    const total=draftQuote.items.reduce((a,i)=>a+(Number(i.qty)||1)*(Number(i.rate)||0),0)-(Number(draftQuote.disc)||0);
    S.quotes.push({...draftQuote,id:uid(),total,createdAt:new Date().toISOString()});
    if(lead){ log(lead,`Quote issued — ${inr(total)}`); if(['pipeline','outreached','warm','mockup'].includes(lead.stage)) lead.stage='quoted'; lead.updatedAt=new Date().toISOString(); }
    draftQuote={id:null,leadId:'',items:[],disc:0,note:'',valid:7};
    persist(); render(); toast('Quote saved to lead');
    return;
  }

  /* metrics tab */
  if(t.id==='mSaveDaily'){
    const doors=Number($('#mDoors').value)||0, convos=Number($('#mConvos').value)||0;
    const status=$('#mDailyStatus');
    status.textContent='Saving…'; status.style.color='var(--muted)';
    try{
      if(!cloudClient && !initCloud()) throw new Error('offline');
      const {error}=await cloudClient.from('daily_manual_stats').upsert({date:today(),doors,convos,updated_at:new Date().toISOString()},{onConflict:'date'});
      if(error) throw error;
      status.textContent='Saved'; status.style.color='var(--mint)';
      renderMetricsCharts(new Date(new Date().setDate(new Date().getDate()-new Date().getDay())).toISOString().slice(0,10));
    }catch(e){ console.error('daily stats save failed',e); logCloudError('Daily stats save failed',e); status.textContent='Could not save — check your connection'; status.style.color='var(--rose)'; }
    return;
  }

  /* data tab */
  if(t.id==='logoutBtn'){
    setSession(false); toast('Logged out'); location.reload(); return;
  }
  if(t.id==='savePw'){
    const cur=$('#curPass').value||'';
    const newUser=($('#newUser').value||'').trim();
    const newPass=$('#newPass').value||'';
    const newPass2=$('#newPass2').value||'';
    const status=$('#pwStatus');
    if(!cur){ status.textContent='Enter your current password'; status.style.color='var(--rose)'; return; }
    if(newPass.length<6){ status.textContent='New password must be at least 6 characters'; status.style.color='var(--rose)'; return; }
    if(newPass!==newPass2){ status.textContent='New passwords do not match'; status.style.color='var(--rose)'; return; }
    status.textContent='Checking…'; status.style.color='var(--muted)';
    try{
      if(!cloudClient && !initCloud()) throw new Error('offline');
      const {data,error}=await cloudClient.from('app_admin').select('*').eq('id',1).maybeSingle();
      if(error||!data) throw error||new Error('no admin row');
      const curHash=await hashPassword(cur,data.password_salt);
      if(curHash!==data.password_hash){ status.textContent='Current password is incorrect'; status.style.color='var(--rose)'; return; }
      const salt=randomSalt();
      const hash=await hashPassword(newPass,salt);
      const username=newUser||data.username;
      const {error:upErr}=await cloudClient.from('app_admin').update({username,password_hash:hash,password_salt:salt,updated_at:new Date().toISOString()}).eq('id',1);
      if(upErr) throw upErr;
      adminUsername=username;
      setAdminCache({username,hash,salt});
      logActivity('update',{field:'app_admin',message:'Admin login credentials changed'});
      toast('Admin login updated');
      render();
      const s2=$('#pwStatus'); if(s2){ s2.textContent='Login updated'; s2.style.color='var(--mint)'; }
    }catch(e){ console.error('password update failed',e); logCloudError('Admin password update failed',e); status.textContent='Could not update — check your connection and try again'; status.style.color='var(--rose)'; }
    return;
  }
  if(t.id==='addCat'){
    const v=$('#newCat').value.trim(); if(!v) return;
    if(!S.cats.includes(v)) S.cats.push(v);
    persist(); render(); return;
  }
  if(d.delcat){ S.cats=S.cats.filter(c=>c!==d.delcat); persist(); render(); return; }
  if(t.id==='bulkFilePick'){ $('#bulkFile').click(); return; }
  if(t.id==='bulkImport'){
    const raw=$('#bulkJson').value.trim();
    const status=$('#bulkStatus');
    const batchName=($('#bulkBatch').value||'').trim()||today();
    if(!raw){ status.textContent='Paste something first'; status.style.color='var(--rose)'; return; }
    let arr;
    try{ arr=JSON.parse(raw); if(!Array.isArray(arr)) throw 0; }
    catch(_){ status.textContent='Not a valid JSON array — check the format'; status.style.color='var(--rose)'; return; }
    const existing=new Set(S.leads.map(l=>(l.biz||'').trim().toLowerCase()+'|'+(l.area||'').trim().toLowerCase()));
    let added=0, skipped=0, bad=0;
    arr.forEach(raw=>{
      if(!raw||!raw.biz||!String(raw.biz).trim()){ bad++; return; }
      const key=String(raw.biz).trim().toLowerCase()+'|'+String(raw.area||'').trim().toLowerCase();
      if(existing.has(key)){ skipped++; return; }
      existing.add(key);
      const l=blankLead();
      Object.assign(l,{
        biz:String(raw.biz).trim(),
        contact:raw.contact||'',
        phone:raw.phone||'',
        email:raw.email||'',
        cat:S.cats.includes(raw.cat)?raw.cat:(raw.cat||S.cats[0]),
        area:raw.area||'',
        maps:raw.maps||raw.maps_link||raw.mapsLink||'',
        batch:raw.batch||batchName,
        source:raw.source||'Scraped — Google Maps',
        stage:'pipeline',
        notes:raw.notes||'',
      });
      if(l.cat && !S.cats.includes(l.cat)) S.cats.push(l.cat);
      log(l,`Imported from research — batch "${l.batch}"`);
      logActivity('create',{leadId:l.id,biz:l.biz,message:`Imported — batch "${l.batch}"`});
      S.leads.unshift(l);
      added++;
    });
    persist(); render();
    if(added) logActivity('create',{field:'batch_summary',message:`Bulk import — batch "${batchName}": ${added} lead(s) added${skipped?`, ${skipped} duplicate(s) skipped`:''}`});
    const el=$('#bulkStatus');
    if(el){ el.style.color='var(--mint)'; el.textContent=`${added} added to "${batchName}"${skipped?`, ${skipped} duplicate skipped`:''}${bad?`, ${bad} missing a name`:''}`; }
    toast(`${added} lead${added===1?'':'s'} added to pipeline`);
    return;
  }
  if(t.id==='expJson'){ download('ground-control-'+today()+'.json',JSON.stringify(S,null,2),'application/json'); return; }
  if(t.id==='expCsv'){ download('leads-'+today()+'.csv',toCSV(),'text/csv'); return; }
  if(t.id==='impBtn'){ $('#impFile').click(); return; }
  if(t.id==='reset'){
    if(confirm('Wipe all leads, templates and quotes on this device? Export first.')){
      logActivity('delete',{message:`Reset everything triggered — ${S.leads.length} lead(s), ${S.templates.length} template(s) cleared locally`});
      S={leads:[],templates:[],quotes:[],cats:[...DEFAULT_CATS],targets:{...DAILY_TARGETS},monthGoal:150000};
      persist(); render(); toast('Reset done');
    } return;
  }
});

document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset||{};
  if(d.f&&openLead&&d.si==null&&d.qi==null){ openLead[d.f]=t.value; syncOpenLead(); return; }
  if(d.si!=null&&openLead){ openLead.sales[Number(d.si)][d.f]=(d.f==='amount'||d.f==='received')?Number(t.value):t.value;
    syncOpenLead();
    const elA=document.getElementById('saleTotal'); if(elA) elA.textContent=inr(leadValue(openLead));
    const elC=document.getElementById('cashTotal'); if(elC) elC.textContent=inr(leadCashIn(openLead));
    return; }
  if(d.qi!=null&&draftQuote){ draftQuote.items[Number(d.qi)][d.f]=(d.f==='desc')?t.value:Number(t.value);
    $('#qPreview').innerHTML=quoteHTML(draftQuote); return; }
  if(t.id==='q'){ filter.q=t.value; const v=$('#view'); const pos=t.selectionStart;
    v.innerHTML=viewBoard(); const nq=$('#q'); nq.focus(); nq.setSelectionRange(pos,pos); return; }
  if(t.id==='qDisc'&&draftQuote){draftQuote.disc=Number(t.value);$('#qPreview').innerHTML=quoteHTML(draftQuote);return;}
  if(t.id==='qNote'&&draftQuote){draftQuote.note=t.value;$('#qPreview').innerHTML=quoteHTML(draftQuote);return;}
  if(t.id==='qValid'&&draftQuote){draftQuote.valid=Number(t.value);$('#qPreview').innerHTML=quoteHTML(draftQuote);return;}
  const map={tDoors:'doors',tConvos:'convos',tMockups:'mockups',tQuotes:'quotes',tCloses:'closes'};
  if(map[t.id]){ S.targets[map[t.id]]=Number(t.value)||1; persist(); renderToday(); return; }
  if(t.id==='tGoal'){ S.monthGoal=Number(t.value)||0; persist(); return; }
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='catFilter'){ filter.cat=t.value; saveFilters(); render(); }
  if(t.id==='batchFilter'){ filter.batch=t.value; saveFilters(); render(); }
  if(t.id==='areaFilter'){ filter.area=t.value; saveFilters(); render(); }
  if(t.id==='sortSel'){ filter.sort=t.value; saveFilters(); render(); }
  if(t.id==='qLead'&&draftQuote){ draftQuote.leadId=t.value; $('#qPreview').innerHTML=quoteHTML(draftQuote); }
  if(t.id==='bulkFile'&&t.files[0]){
    const r=new FileReader();
    r.onload=()=>{ const box=$('#bulkJson'); if(box){ box.value=r.result; } toast('Loaded into box — review, then Import'); };
    r.readAsText(t.files[0]);
  }
  if(t.id==='impFile'&&t.files[0]){
    const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      S={...S,...d,cats:d.cats&&d.cats.length?d.cats:S.cats}; persist(); render(); toast('Import complete');
    }catch(_){ toast('That file is not valid JSON'); } };
    r.readAsText(t.files[0]);
  }
});
$('#scrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

/* template image: downscale before storing so we don't blow the 5MB quota */
function pickTemplateImage(id){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=760, sc=Math.min(1,max/img.width);
        const c=document.createElement('canvas');
        c.width=img.width*sc; c.height=img.height*sc;
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        const t=S.templates.find(x=>x.id===id);
        if(t){ t.img=c.toDataURL('image/jpeg',.72); persist(); render(); toast('Preview added'); }
      };
      img.src=r.result;
    };
    r.readAsDataURL(f);
  };
  inp.click();
}
document.addEventListener('dblclick',e=>{
  const card=e.target.closest('.tcard'); if(!card) return;
  const btn=card.querySelector('[data-deltpl]'); if(btn) pickTemplateImage(btn.dataset.deltpl);
});

function download(name,content,type){
  const b=new Blob([content],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
function toCSV(){
  const head=['Business','Owner','Phone','Email','Category','Area','Batch','Maps link','Source','Stage','Next follow-up','Sold','Deal value','Cash received','Potential','Notes'];
  const rows=S.leads.map(l=>[l.biz,l.contact,l.phone,l.email,l.cat,l.area,l.batch,l.maps,l.source,l.stage,l.next,
    (l.sales||[]).map(s=>s.item).join(' | '),leadValue(l),leadCashIn(l),pipeValue(l),(l.notes||'').replace(/\n/g,' ')]);
  return [head,...rows].map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n');
}

/* ============================================================
   BOOT
   ============================================================ */
(async function init(){
  loadFilters();
  const saved=await Store.load();
  if(saved) S={...S,...saved,cats:(saved.cats&&saved.cats.length)?saved.cats:DEFAULT_CATS,targets:{...DAILY_TARGETS,...(saved.targets||{})}};
  else {
    S.templates=[
      {id:uid(),name:'Beautician & Salons',cat:'Salon & Spa',url:'https://parlour-zeta.vercel.app/',img:''},
      {id:uid(),name:'Travel Agency',cat:'Travel Agency',url:'https://travelagency-livid.vercel.app/',img:''},
      {id:uid(),name:'Hotels / Hospitality / Airbnb',cat:'Hotel / Stay',url:'https://hotel-website-teal-three.vercel.app/',img:''},
      {id:uid(),name:'Real Estate',cat:'Real Estate',url:'https://real-state-sandy-iota.vercel.app',img:''},
      {id:uid(),name:'Interior Design',cat:'Interior Design',url:'https://interior-design-website-bay.vercel.app',img:''}
    ];
  }
  // backfill on-brand icon thumbnails for any template missing an image —
  // covers both the fresh install above and anyone returning with older saved data
  let backfilled=false;
  (S.templates||[]).forEach(t=>{
    if(!t.img && DEFAULT_THUMBS[t.url]){ t.img=DEFAULT_THUMBS[t.url]; backfilled=true; }
  });
  if(!saved || backfilled) await Store.save(S);

  initCloud();
  const cached=getAdminCache();
  if(cached) adminUsername=cached.username;

  if(hasSession()){
    enterApp();
    return;
  }

  $('#authGate').style.display='flex';
  let hasAdmin=false;
  try{
    if(cloudClient){
      const {data,error}=await cloudClient.from('app_admin').select('id').eq('id',1).maybeSingle();
      if(!error && data) hasAdmin=true;
    }
  }catch(e){ console.error('admin lookup failed',e); }
  if(!hasAdmin && cached) hasAdmin=true;
  renderGate(hasAdmin?'login':'setup');
})();
</script>
